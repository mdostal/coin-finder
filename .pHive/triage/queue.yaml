items:
  - id: bulk-private-key-extraction
    title: Bulk "try to extract private keys" across findings
    description: >
      User's own words: "can we try to extract keys from MOST of them etc
      as well" -- extend tools/extract_private_key.py's existing
      per-address WIF-extraction flow (currently a manual, one-at-a-time
      action) into a bulk action over a multi-select of findings, same
      shape as the bulk Try-unlock action shipped in ui-design-options
      (uio-03). Directly related to the in-flight
      credential-clarity-and-unlock-ux epic's credential-completeness
      indicator -- that epic's research into extract_private_key.py's
      real preconditions/cost should inform whether this is safe to run
      unattended across many findings at once or needs throttling/limits.
      Deliberately NOT folded into the in-flight epic per the user's
      explicit instruction to keep recording new asks as backlog rather
      than scope-creeping the epic already in flight.
