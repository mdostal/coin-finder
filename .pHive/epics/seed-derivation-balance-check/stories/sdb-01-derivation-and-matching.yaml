design_decisions:
  - decision: Never compute or expose raw private keys/WIF -- addresses only.
    rationale: Minimizes derived-secret surface area; the user re-derives the actual spending key in trusted wallet software once a match is known.
  - decision: Phrase text appears in the report only for phrases with an actual finding; non-findings are reported by index only.
    rationale: Avoids gratuitously repeating secret material in the output file for phrases that produced nothing actionable.
  - decision: CLI reads phrases only from a file, never a command-line argument.
    rationale: CLI args are visible in shell history and `ps aux` -- a real exposure risk for private-key-equivalent material.

risks:
  - severity: medium
    description: Bounded scheme coverage (BIP44/49/84 x BTC/ETH/LTC) will miss exotic old-wallet derivation schemes.
    mitigation: Explicitly deferred to a user-requested future "deep dive" epic; stated in the report, not silently dropped.
  - severity: high
    description: Careless phrase-text handling (stdout, logs) is a real secret-exposure risk, same class as find_seed_phrases.py.
    mitigation: File-only input, no-stdout-printing, phrase-redacted-on-non-finding -- all covered by explicit acceptance criteria and tests.

