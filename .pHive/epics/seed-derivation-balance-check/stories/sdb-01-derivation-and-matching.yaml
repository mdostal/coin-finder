id: sdb-01-derivation-and-matching
epic: seed-derivation-balance-check
title: Bounded multi-scheme HD derivation + balance-check matcher
status: shipped
shipped_at: "2026-08-13T00:00:00Z"
release_id: "v0.7.0"
complexity: medium
methodology: tdd
depends_on: []

description: |
  New module tools/match_seed_phrases.py:

  - `derive_candidate_addresses(phrase, num_addresses=5) -> list[dict]`: for
    each (scheme, coin) in the bounded v1 set -- BIP44/BIP49/BIP84 for
    Bitcoin, BIP44 for Ethereum and Litecoin -- derive external-chain
    addresses (account=0, change=0) for index 0..num_addresses-1 using
    bip_utils. Returns `[{"scheme": "BIP44"|"BIP49"|"BIP84", "coin": str,
    "index": int, "address": str}, ...]`. Never computes or returns a private
    key / WIF -- addresses only.
  - `check_derived_balances(derived) -> list[dict]`: for each derived address,
    check balance via the existing per-coin service (BitcoinService,
    EthereumService, LitecoinService from services/) using the existing
    retry helper (tools.check_wallet_balances._check_balance_with_retries --
    reused, not duplicated). Returns the same list with a "balance" key added
    to each entry.
  - `match_phrases(phrases, num_addresses=5) -> dict`: runs the above for each
    phrase in `phrases` (a list of strings). Returns
    `{phrase: [derived+balance dicts]}`.
  - `load_phrases_from_file(path) -> list[str]`: accepts either
    find_seed_phrases.py's output JSON shape (dict of file_path -> [{"phrase":
    ...}]) or a plain newline-separated text file of phrases, and returns a
    deduplicated flat list.
  - `render_match_report(results) -> str`: for phrases with at least one
    non-zero-balance derived address, includes the phrase text and every
    non-zero finding. For phrases with nothing found, reports only the input
    index (e.g. "phrase #2: no balance found across N addresses checked") --
    phrase text is NOT repeated for non-findings.
  - CLI: `python tools/match_seed_phrases.py <phrases_file> <output_file>` --
    reads phrases only from `<phrases_file>` (never a CLI argument -- shell
    history / ps aux exposure). Never prints phrase text to stdout, only
    counts and (for actual findings) addresses + balances. Report states the
    bounded v1 scheme coverage explicitly (not a silent limitation).

acceptance_criteria:
  - "Given the standard public BIP39 test vector, when derive_candidate_addresses runs with num_addresses=1, then it returns exactly the well-known, publicly documented BIP44/49/84 BTC and BIP44 ETH/LTC addresses for that mnemonic"
  - "Given derive_candidate_addresses output, when inspected, then no entry contains a private key or WIF field -- addresses only"
  - "Given a mocked balance-check service returning a non-zero balance for one derived address, when check_derived_balances runs, then that entry's balance field reflects it and other entries remain unaffected"
  - "Given find_seed_phrases.py's output JSON shape, when load_phrases_from_file runs, then it returns a deduplicated flat list of phrase strings"
  - "Given a plain newline-separated phrase file, when load_phrases_from_file runs, then it returns the same flat list shape"
  - "Given a phrase with at least one non-zero-balance derived address, when render_match_report runs, then the phrase text appears in the report alongside that finding"
  - "Given a phrase with zero non-zero-balance derived addresses, when render_match_report runs, then the phrase text does NOT appear in the report -- only its input index and a 'no balance found' summary"
  - "Given the CLI runs against a fixture phrases file, when its stdout is captured, then no phrase text appears in stdout/stderr"

steps:
  - id: research
    description: Re-confirm bip_utils's Bip44/Bip49/Bip84 API shape (already live-verified against the public test vector during epic research) and tools/check_wallet_balances.py's _check_balance_with_retries signature for reuse.
    agent: researcher
  - id: test-spec
    description: |
      Write failing tests in tests/test_match_seed_phrases.py using the
      well-known public BIP39 test vector (safe, standard fixture) and mocked
      balance-check services (no real network calls), covering every
      acceptance criterion above.
    agent: tester
    depends_on: [research]
  - id: implement
    description: Implement derive_candidate_addresses, check_derived_balances, match_phrases, load_phrases_from_file, render_match_report, and the CLI to make the failing tests pass. Do not modify the tests.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Review specifically that no derived-key/WIF material is ever computed or exposed, that stdout never contains phrase text under any code path, and that phrase text is genuinely absent from non-finding report entries.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit tools/match_seed_phrases.py, tests/test_match_seed_phrases.py, and requirements.txt. Manually run the CLI against the public test vector (real balance lookups -- long-known to be empty, validates plumbing safely) to confirm no phrase text leaks to stdout.
    agent: developer
    depends_on: [review]

