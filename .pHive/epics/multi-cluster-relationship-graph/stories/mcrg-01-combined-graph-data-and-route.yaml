    relevant_excerpt: "Section 3.1 (query design) and 3.3 (route design)."
  - path: .pHive/epics/group-view-graph/docs/design-discussion.md
    relevant_excerpt: "Section 4 -- the original scoping decision that deferred a real graph view to this follow-up epic."
