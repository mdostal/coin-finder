    change: "Extend colorFor()/tooltip logic with overlap-border treatment and multi-run evidence display"
  - file: web/crawl_runs.py
    change: "Add run_id-set-scoped overlap detection (sibling of find_overlap_addresses, not a modification of it)"
  - file: web/templates/group_view.html
    change: "Add multi-select checkboxes per run + 'View combined graph' action"
  - file: tests/test_crawl_runs.py
