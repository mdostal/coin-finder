design_decisions:
  - decision: "Overlap treatment is a border/shape change, never a color change to the existing confidence fill"
    rationale: "Confirmed in design discussion §3.2 -- conflating the two signals into one color channel would make the graph unreadable (can't tell if a node is high-confidence, cross-group, or both)"

risks:
  - severity: low
    description: "Extending graph.js risks accidentally regressing the existing single-group graph view (item_result.html) if the shared functions aren't kept backward compatible"
    mitigation: "Explicit test coverage confirming the single-group path (no overlap data present) renders identically to before this story"

cross_cutting:
  - concern: documentation
    action: "README.md's relationship-graph section documents the full combined-view + overlap-highlighting capability once this ships"

references:
  - path: .pHive/epics/multi-cluster-relationship-graph/docs/design-discussion.md
    relevant_excerpt: "Section 3.2 (overlap as independent visual signal), 3.4 (entry point), 3.5 (tooltip convention)."
