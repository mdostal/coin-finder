id: ehi-01-exodus-unlock
epic: exodus-hashcat-integration
title: Install hashcat + exodus2hashcat.py, offline-gated unlock wrapper
status: shipped
shipped_at: "2026-08-13T00:00:00Z"
release_id: "v0.12.0"
complexity: medium
methodology: tdd
depends_on: []

description: |
  scripts/install_exodus_tools.sh: fetches hashcat's official
  tools/exodus2hashcat.py into vendor/hashcat-tools/ (gitignored) and
  installs hashcat itself via Homebrew on macOS.

  tools/unlock_exodus_wallet.py:
  - extract_exodus_hash(seed_seco_path, script_path=None): shells out to
    exodus2hashcat.py, returns the EXODUS:... hash line. Raises RuntimeError
    with the script's stderr on failure.
  - find_exodus2hashcat_script(): locates vendor/hashcat-tools/exodus2hashcat.py.
  - run_exodus_unlock(seed_seco_path, candidates_file, script_path=None,
    allow_online=False): HARD SAFETY GATE identical in spirit to
    unlock_wallet.py -- reuses check_network_status() from that module
    (imported, not duplicated). Extracts the hash, writes to a temp file,
    runs `hashcat -m 28200 -a 0 --potfile-disable --backend-devices-keepfree
    5 --scrypt-tmto 4 -o <outfile> <hashfile> <candidates_file>`.
  - CLI: candidates from a file only, never a CLI argument.

acceptance_criteria:
  - "Given the machine is online, when run_exodus_unlock is called without allow_online, then it raises RuntimeError and no subprocess is invoked"
  - "Given the machine is verified offline (mocked), when run_exodus_unlock is called, then it proceeds to invoke hash extraction and the hashcat subprocess"
  - "Given a malformed (non-SECO) file, when extract_exodus_hash runs against the real exodus2hashcat.py script, then it raises RuntimeError with a clear message rather than crashing uninformatively"
  - "Given hashcat's own official example hash and password (mode 28200, 'Example.Pass: hashcat'), when run_exodus_unlock runs end-to-end (extraction mocked to return the example hash, real hashcat crack), then the password is recovered"
  - "Given the CLI is invoked with a candidates file, when its own argv is inspected, then no password/candidate text appears in the command-line arguments"

steps:
  - id: research
    description: (Already completed via live web research and live experimentation during epic research -- documented in docs/design-discussion.md, including the discovery that a hand-built synthetic test hash was wrong and hashcat's own shipped example was the correct fixture to use.)
    agent: researcher
  - id: test-spec
    description: |
      Write failing tests in tests/test_unlock_exodus_wallet.py using
      hashcat's own official example hash + password (mode 28200) -- a
      public fixture from the hashcat project itself, not a real wallet.
    agent: tester
    depends_on: [research]
  - id: implement
    description: Implement extract_exodus_hash, find_exodus2hashcat_script, run_exodus_unlock, and the CLI to make the failing tests pass, including the --backend-devices-keepfree/--scrypt-tmto tuning flags found necessary during research. Do not modify the tests.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Review that the offline safety gate mirrors unlock_wallet.py's (reused function, not reimplemented divergently), and that no code path passes password/candidate content as a subprocess or CLI argument.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit scripts/install_exodus_tools.sh, tools/unlock_exodus_wallet.py, tests/test_unlock_exodus_wallet.py, vendor/hashcat-tools/exodus2hashcat.py exclusion in .gitignore. Ran the full flow (install, extraction against the real seed.seco, hashcat crack against the official example) locally during research.
    agent: developer
    depends_on: [review]

