design_decisions:
  - decision: Use hashcat's own official example hash + password (mode 28200) as the test fixture, instead of hand-constructing a synthetic one.
    rationale: A hand-built synthetic hash (from METADATA_* size constants alone) was tried first and was wrong -- the real format has a two-layer key-wrapping structure the constants don't fully reveal. hashcat's own shipped example is correct by construction.
  - decision: Reuse check_network_status() from tools/unlock_wallet.py rather than reimplementing it.
    rationale: Identical safety semantics needed across both wallet-unlock tools; a single implementation avoids drift.
  - decision: Default hashcat invocation includes --backend-devices-keepfree 5 --scrypt-tmto 4.
    rationale: Needed to work around a memory-allocation issue found live in this sandboxed environment; harmless (speed/reliability tradeoff only) elsewhere, so kept as a default rather than conditional.

risks:
  - severity: critical
    description: Running a real password-guessing attempt against a real wallet while online is the same failure mode the BTCRecover integration's safety gate exists to prevent.
    mitigation: Identical hard offline gate, reused from unlock_wallet.py; this epic's testing never touches the real seed.seco.
  - severity: low
    description: vendor/hashcat-tools/exodus2hashcat.py tracks upstream HEAD, not pinned.
    mitigation: Accepted, same tradeoff as vendor/btcrecover/.

references:
  - path: .pHive/epics/exodus-hashcat-integration/docs/design-discussion.md
    relevant_excerpt: |
      "hashcat's own official repository ships tools/exodus2hashcat.py...
      feeding hashcat's own mode 28200... a first-class, natively supported
      hash mode."
