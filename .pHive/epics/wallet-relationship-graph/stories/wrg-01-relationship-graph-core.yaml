design_decisions:
  - decision: Normalize both wallet_analysis.json and wallet_balances.json shapes to a common internal representation at the top of build_relationship_graph(), rather than branching throughout.
    rationale: Keeps the signal-computation logic shape-agnostic and easy to test; only the normalization step needs to know about both input shapes.
  - decision: coverage_gaps.missing_supported_coins compares against config.wallet.WALLET_SERVICES.keys(), not an external "what coins does this wallet app support" list.
    rationale: Simpler, no new data source, and avoids an overclaim -- see design-discussion.md Open Question 2. Report copy makes the nudge/question framing explicit.

risks:
  - severity: medium
    description: coverage_gaps could read as an overclaim ("this file has these coins") if report wording is careless.
    mitigation: Acceptance criterion requires nudge/question phrasing; reviewer step explicitly checks this.
  - severity: low
    description: None-balance addresses (API failures) could get silently coerced to 0 or dropped if implementation carelessly does `if balance:` checks.
    mitigation: Explicit acceptance criterion + test case for None-balance preservation.

