    rationale: "Explicitly small, well-understood scope per the triage item's own framing -- proportional planning effort, not a rigid one-size-fits-all ceremony"

risks:
  - severity: low
    description: "Collapsing the two distinct resume phases (per-generation vs per-address) into one undifferentiated unit-completion model would silently change resume granularity"
    mitigation: "Explicit acceptance criteria for both phases' resume behavior separately, not just checkpoint-format parity"

