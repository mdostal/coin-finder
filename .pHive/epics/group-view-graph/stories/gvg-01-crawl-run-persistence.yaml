code_examples:
  - title: "The exact _connect/_SCHEMA/_MIGRATIONS pattern to replicate"
    file: web/findings.py
    snippet: |
      _SCHEMA = """
      CREATE TABLE IF NOT EXISTS findings (
          coin TEXT NOT NULL, address TEXT NOT NULL, ...
          PRIMARY KEY (coin, address)
      )
      """
      _MIGRATIONS = [("watched", "INTEGER NOT NULL DEFAULT 0"), ...]

      def _connect(db_path):
          db_path = Path(db_path)
          db_path.parent.mkdir(parents=True, exist_ok=True)
          conn = sqlite3.connect(str(db_path))
          conn.row_factory = sqlite3.Row
          conn.execute(_SCHEMA)
          for column, definition in _MIGRATIONS:
              try:
                  conn.execute(f"ALTER TABLE findings ADD COLUMN {column} {definition}")
              except sqlite3.OperationalError:
                  pass  # already migrated
          return conn
  - title: "The exact call site to extend"
    file: web/app.py
    snippet: |
      def _run_crawl_job(addresses):
          ...
          results = crawl_wallet_cluster(seeds)
          ...
          for address, info in results.items():
              record_finding("Bitcoin", address, info.get("balance"), source_label="crawl_transaction_graph")
          # <-- add record_crawl_run(seeds, results) here
          return {"report": render_cluster_report(results), "results": results}

design_decisions:
  - decision: "Two tables (runs, run_addresses) instead of one denormalized table or a JSON blob column."
    rationale: "gvg-02's overlap query needs 'GROUP BY address HAVING COUNT(DISTINCT run_id) > 1' -- a plain indexed SQL query. A JSON-blob-per-run design would force scanning and parsing every run in Python instead."
  - decision: "New db file (crawl_runs.db), not new columns on findings.db."
    rationale: "A crawl run has a one-to-many relationship with discovered addresses, and the same address can appear in many runs -- doesn't fit findings.py's (coin, address) primary-key model at all."

risks:
  - severity: low
    description: "Only unit-testable in isolation until gvg-02's overlap query exists to prove the data shape is actually useful."
    mitigation: "gvg-01's own acceptance criteria (persist + list) are independently correct and testable without gvg-02; gvg-02 depends on this story and will exercise it end-to-end."

