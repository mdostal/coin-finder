id: gvg-01-crawl-run-persistence
epic: group-view-graph
title: Persist every crawl run's full result to disk
status: pending
complexity: medium
methodology: tdd
depends_on: []

description: |
  web/app.py's _run_crawl_job() calls tools/crawl_transaction_graph.py's
  crawl_wallet_cluster() and gets back a full result dict
  ({address: {confidence, generation, balance, last_activity_timestamp,
  dormant_years}}), but only ever writes the flattened balance into
  findings.db via record_finding() -- the crawl run itself (which seed(s)
  produced which discoveries, at what confidence/generation) is thrown away
  once the job's in-memory result is gone. Add a new sqlite-backed module,
  web/crawl_runs.py, that persists every crawl run in full, so a later
  "group view" (story gvg-02) can query across all saved runs.

acceptance_criteria:
  - "Given a completed crawl_wallet_cluster() result, when record_crawl_run(seed_addresses, results) is called, then a new run row and one child row per discovered address are persisted to crawl_runs.db"
  - "Given _run_crawl_job() runs a real crawl, when it completes, then record_crawl_run() is called with the same seed addresses and results already used for the existing record_finding() loop -- no change to record_finding()'s own behavior"
  - "Given list_crawl_runs() is called, then it returns every saved run newest-first, each with its seed addresses and discovered-address count"
  - "Given a pre-existing crawl_runs.db from before any future schema change, when _connect() runs, then it migrates in place via the same ALTER TABLE + OperationalError-catch pattern web/findings.py already uses (no crash, no data loss)"
  - "Given crawl_runs.db does not exist yet, when any function in this module is called, then app_data_dir() creates the parent directory automatically, matching web/findings.py's _connect()"

steps:
  - id: research
    description: Confirm the exact shape of crawl_wallet_cluster()'s return value and _run_crawl_job()'s call site before writing the schema.
    agent: researcher
  - id: test-spec
    description: |
      Write failing tests for record_crawl_run(), list_crawl_runs(), and the
      migration path, modeled directly on tests/test_findings.py's existing
      test shapes (tmp_path-based db_path, no mocking needed -- these are
      real sqlite files in a temp dir).
    agent: tester
    depends_on: [research]
  - id: implement
    description: |
      Write web/crawl_runs.py and wire record_crawl_run() into
      _run_crawl_job() (web/app.py, ~line 754-773) right after the existing
      record_finding() loop.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Review schema design (two tables, not one denormalized blob), migration correctness, and that _run_crawl_job()'s existing behavior is unchanged.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit on feat/group-view-graph.
    agent: developer
    depends_on: [review]

