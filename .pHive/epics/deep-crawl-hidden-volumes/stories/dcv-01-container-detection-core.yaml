    relevant_excerpt: |
      "The standard heuristic... 1. No recognized file-type signature... 2. High
      Shannon entropy... 3. Size is a multiple of 512 bytes... 4. Minimum size floor."
  - path: .pHive/epics/deep-crawl-hidden-volumes/docs/design-discussion.md
    relevant_excerpt: |
      Section 3, point 1: exact function signatures and the "reads only size plus
      head/middle/tail samples" constraint.
