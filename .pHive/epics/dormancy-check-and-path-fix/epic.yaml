name: dormancy-check-and-path-fix
title: Dormancy Check + Standalone-Invocation Fix
description: >
  Fixes a pre-existing bug where tools/*.py scripts that import config/services
  fail when run standalone (python tools/foo.py) due to sys.path not including
  the repo root. Adds dormancy/last-activity reporting to the transaction-graph
  crawler so users can verify their own assumptions about a wallet's activity
  history against the real blockchain record.
