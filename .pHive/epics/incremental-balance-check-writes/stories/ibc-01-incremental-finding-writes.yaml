  baseline: "0 (findings.db never changes until the whole run completes, confirmed live)"
  target: ">0 during an in-progress run"
  window: next real check-balances run after this ships
  source:
    kind: manual
    ref: "query findings.db's checked-count while a real check-balances job's /api/jobs/<id> status is still 'running'"
