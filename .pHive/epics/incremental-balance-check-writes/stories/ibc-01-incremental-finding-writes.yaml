design_decisions:
  - decision: finding_callback is additive, not a replacement for the end-of-run write.
    rationale: Keeps a single, well-tested completion path unchanged (idempotent upsert makes calling record_finding() twice for the same address harmless) while adding real-time visibility and crash resilience -- lowest-risk way to close the gap.
  - decision: Only fire finding_callback for a CONFIRMED (non-None) balance, mirroring the existing checkpoint's own confirmed-only rule.
    rationale: An inconclusive balance isn't a "finding" yet -- it's retried on the next run exactly like a never-checked address; writing it to findings.db early would be premature and inconsistent with the checkpoint's own semantics.

cross_cutting:
  - concern: documentation
    action: "No user-facing behavior/workflow change (findings just appear sooner) -- README's existing description of the findings dashboard doesn't need updating."

