  owner: developer

risks:
  - severity: low
    description: Calling record_finding() (a sqlite write) from inside check_one()'s progress_lock could add contention if findings.db is slow, slightly serializing what was previously a lock only used for in-memory dict updates.
    mitigation: record_finding() is already called from a background job thread today (just later) with no reported contention issue -- moving it earlier doesn't change its concurrency characteristics, only its timing. Confirm during review that progress_lock isn't held for the network-call portion (it isn't -- only the result-recording portion, per the existing code).

