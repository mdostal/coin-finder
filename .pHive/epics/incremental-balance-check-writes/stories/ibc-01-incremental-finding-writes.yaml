id: ibc-01-incremental-finding-writes
epic: incremental-balance-check-writes
title: Write confirmed balances to findings.db as they're found, not only at job completion
status: pending
complexity: medium
methodology: tdd
depends_on: []

description: |
  _run_check_balances_job (web/app.py:2960-3009) only calls record_finding()
  once, after run_pipeline.check_balances() fully returns -- which itself
  only writes its single wallet_balances.json output file in one
  json.dump() call at the very end of check_wallet_balances()
  (tools/check_wallet_balances.py:354-355). Confirmed live: a real
  check-balances job survived an app crash mid-run (checkpoint correctly
  fast-forwarded past already-confirmed addresses on resume), but
  findings.db showed zero new rows the entire time, for hours, because
  nothing is written there until the whole 141k-address run finishes.

  check_wallet_balances() already confirms each balance inside check_one()
  under progress_lock (tools/check_wallet_balances.py:292-296), the exact
  same point progress_callback already fires -- this story adds a sibling
  finding_callback(file_path, crypto_name, address, balance) invoked from
  that same block, so a caller can persist a confirmed balance the moment
  it's known, not hours later. This makes real progress visible in the
  findings dashboard during a long run, and means a future crash mid-run
  loses zero already-confirmed results from the user-visible database (not
  just from the checkpoint, which was already safe).

acceptance_criteria:
  - "Given a check-balances run in progress, when an address's balance is confirmed, then record_finding() is called for it immediately (same call as the eventual end-of-run write would have made), not deferred until the whole run finishes."
  - "Given check_wallet_balances() is called with no finding_callback (every existing caller: CLI, tests), when it runs, then behavior is byte-identical to today -- this is an additive, optional parameter, not a required one."
  - "Given a run is paused or the mount disconnects mid-run, when that happens, then every address confirmed before the interruption is already in findings.db (verifiable by checking the dashboard immediately after the interruption, not after a resume)."
  - "Given the run completes normally, when it finishes, then the existing end-of-run wallet_balances.json write and its own record_finding() pass still happen too -- this is additive/redundant-by-design (record_finding() is an existing upsert, calling it twice for the same confirmed address is harmless), not a replacement for the final write."

steps:
  - id: research
    description: Confirm the exact call site and locking semantics inside check_one() (progress_lock) that finding_callback should be invoked from, and confirm record_finding()'s upsert is safe to call from a background thread while a Flask job is running (existing progress_callback is already called from the same thread context, so likely already safe -- verify, don't assume).
    agent: researcher
  - id: test-spec
    description: |
      Write failing tests for: finding_callback is invoked once per confirmed balance with the correct (file_path, crypto_name, address, balance) args, at the same point progress_callback fires; an inconclusive (None) balance does NOT invoke finding_callback (matches the existing checkpoint behavior of only ever storing confirmed balances); no finding_callback passed = no behavior change (regression guard); _run_check_balances_job wires finding_callback to record_finding() and a finding shows up in findings.db before the job's overall status is "done".
    agent: tester
    depends_on: [research]
  - id: implement
    description: |
      Add finding_callback=None parameter to check_wallet_balances() (tools/check_wallet_balances.py), invoked from check_one()'s existing progress_lock block right where results[...] is set (line ~293), only when balance is not None. Wire it in web/app.py's _run_check_balances_job (and the selected-files variant, _run_check_balances_selected_job, same pattern) via run_pipeline.check_balances(...)'s existing kwarg-forwarding path (mirrors how progress_callback/mount_health_check are already forwarded), calling record_finding(coin, address, balance, source_path=file_path, source_label="scan") from the callback -- the exact same call already made at the end-of-run pass, just moved earlier too (not instead of).
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Review implementation and tests for correctness and convention compliance
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch
    agent: developer
    depends_on: [review]

