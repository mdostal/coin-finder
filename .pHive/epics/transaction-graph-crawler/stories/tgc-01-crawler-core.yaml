    change: new file -- core heuristic and BFS tests

design_decisions:
  - decision: Common-input-ownership (co-spend) clustering as the primary, always-followed signal; bounded output-following as a secondary, capped, lower-confidence signal.
    rationale: Real data from the actual found address showed 100+-output transactions (mining pool/exchange pattern) that would explode a naive full-graph BFS. design-discussion.md Section 3-4.
  - decision: Reuse services/bitcoin.py::BitcoinService for balance checks rather than writing new balance logic.
    rationale: Avoids duplicating the existing, already-tested balance-check code path.

risks:
  - severity: high
    description: Even bounded, a busy address could discover many addresses across generations.
    mitigation: Hard max_addresses cap, explicitly reported when reached (never silent truncation).
  - severity: medium
    description: Output-following can misattribute a genuine third-party payment as same-owner.
    mitigation: Tagged confidence="output" (vs "co-spend") in every result entry so downstream consumers (report, user) can weight accordingly.

