    change: add load_seed_addresses, update CLI to use it
  - file: tests/test_crawl_transaction_graph.py
    change: extend with load_seed_addresses and multi-seed tests
  - file: docs/wallet_recovery_reference.md
    change: new file
  - file: README.md
    change: link the new reference doc, update the pipeline diagram description if needed

cross_cutting:
  - concern: documentation
    action: "New docs/wallet_recovery_reference.md, linked from a new README section."

references:
  - path: .pHive/epics/multi-seed-and-recovery-reference/docs/design-discussion.md
    relevant_excerpt: |
      "Reliable automated detection of 'this address belonged to exchange X'
      isn't achievable from public blockchain data alone... The honest,
      defensible scope is a reference document, not a classifier."
