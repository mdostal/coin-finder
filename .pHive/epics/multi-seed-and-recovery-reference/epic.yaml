name: multi-seed-and-recovery-reference
title: Multi-Seed Crawler + Recoverability Reference
description: >
  Lets crawl_transaction_graph.py's CLI take multiple seed addresses (mixing
  addresses found on disk with addresses the user currently holds/knows
  about), and adds a curated reference document on wallet-software/service
  recoverability so the user can judge realistic recovery odds -- explicitly
  scoped as a reference to cross-check, not an automated classifier, since
  that isn't reliably achievable from blockchain data alone.
