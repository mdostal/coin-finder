files_to_modify:
  - file: tools/find_password_candidates.py
    change: "New file. Scanner + heuristic matching"
  - file: web/app.py
    change: "New job type + review route"
  - file: web/templates/password_scan_review.html
    change: "New template. Candidate review UI (no ingestion action yet)"
  - file: tests/test_find_password_candidates.py
