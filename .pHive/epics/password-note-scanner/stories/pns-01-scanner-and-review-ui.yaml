design_decisions:
  - decision: "Reuse find_seed_phrases.py's file-discovery shape, not search_wallets.py's"
    rationale: "search_wallets.py is filename-driven (extension/coin-name/keyword in the FILENAME) -- a password note has no reason to be named that way; find_seed_phrases.py already walks every file with no filename gate, which is what content-based matching needs"
  - decision: "No vault ingestion in this story"
    rationale: "The review step must show real candidates and real volume before anything is wired into the auto-unlock pipeline -- confirmed as the right slice boundary in the vertical plan"

risks:
  - severity: medium
    description: "Keyword-proximity heuristic has a real, previously-unmeasured false-positive rate -- no checksum/structural validator exists for this domain, unlike every other matcher in this codebase"
    mitigation: "Explicit acceptance criterion requiring real measurement against a representative test corpus, documented plainly rather than assumed solved -- same 'no silent coverage claims' discipline as candidate-match-integrity"

cross_cutting:
  - concern: documentation
    action: "README.md gets a new section describing this scan type once both stories ship, explicitly noting it's a best-effort heuristic, not a validated match like address/seed-phrase scanning"

references:
  - path: .pHive/epics/password-note-scanner/docs/design-discussion.md
    relevant_excerpt: "Section 3.1-3.3 (scanner design) and section 2's candidate-match-integrity lesson analysis."
