id: pns-01-scanner-and-review-ui
epic: password-note-scanner
title: Core scanner + candidate review UI (no vault ingestion yet)
status: pending
complexity: medium
methodology: tdd
depends_on: []

description: |
  Build tools/find_password_candidates.py, a new scanner parallel to
  tools/find_seed_phrases.py -- reuse its exact file-discovery shape (no
  filename/extension allowlist, walk every file under a path, same 10MB
  size cap, same binary-vs-text sniff via null-byte detection on the first
  8KB) rather than search_wallets.py's filename-driven approach, since a
  password/credential note has no reason to have a "wallet"-shaped
  filename.

  Matching heuristic (no structural/checksum validator exists for this,
  unlike address matching -- this is a real, honest limitation, not a gap
  to hide): match lines containing explicit credential labels
  (case-insensitive "password:", "pw:", "pass:", "passphrase:", "pwd:")
  followed by a token, OR a plausible password-shaped token on a line that
  also mentions a coin/wallet name -- reuse config/search.py's existing
  COIN_NAMES/WALLET_KEYWORDS lists as the proximity anchor for the second
  case, don't duplicate that list.

  This story ships the scan + a review UI showing what was found (source
  file, line context, the matched candidate) -- NOT vault ingestion, which
  is pns-02. The user needs to see real candidates and real volume/noise
  before anything gets wired into auto-unlock.

  Never call record_finding() or anything that could make a discovered
  password candidate look like a recovered balance -- this scanner's
  output is candidates, never findings.

acceptance_criteria:
  - "Given a directory with a plain text file containing 'password: hunter2', when scanned, then a candidate is found with the file path, line, and matched value"
  - "Given a directory with a plain text file containing a token near a coin name (e.g. 'bitcoin backup: correcthorsebatterystaple' on one line), when scanned, then a candidate is found via the coin-name-proximity path"
  - "Given a directory with ordinary prose containing no credential labels or coin-name proximity, when scanned, then no candidates are found -- explicit false-positive-avoidance test, not just a happy-path test"
  - "Given a binary file (e.g. an image) in the scan path, when scanned, then it's skipped via the same null-byte binary-detection sniff find_seed_phrases.py already uses, not read/matched against"
  - "Given a file larger than the 10MB cap, when scanned, then it's skipped, matching find_seed_phrases.py's existing size-cap behavior"
  - "Given a completed scan, when the results are surfaced to the user, then nothing is written to findings.db or any vault store -- this story is read-only/review-only, confirmed by an explicit test that no vault/findings write functions are called"
  - "Given a real-world test corpus of representative note-shaped text (a mix of real credential-labeled lines and ordinary prose that happens to mention passwords/security topics without being one), when scanned, then the false-positive rate is measured and reported in the story's completion notes -- not assumed zero"

steps:
  - id: research
    description: Confirm find_seed_phrases.py's exact file-discovery/binary-sniff implementation to reuse precisely, and config/search.py's exact COIN_NAMES/WALLET_KEYWORDS list to import rather than duplicate.
    agent: researcher
  - id: test-spec
    description: Write failing tests for the scanner (label-based matches, coin-name-proximity matches, true-negative prose, binary-file skipping, size-cap skipping, zero writes to findings/vault stores) plus the review-route rendering.
    agent: tester
    depends_on: [research]
  - id: implement
    description: Implement tools/find_password_candidates.py and the web job + review route/template.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Review specifically for false-positive rate honesty -- confirm the real test-corpus measurement was performed and documented, not skipped or assumed.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

