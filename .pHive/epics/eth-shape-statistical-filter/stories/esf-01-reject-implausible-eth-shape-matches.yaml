design_decisions:
  - decision: A new validator function, not a modification of _pass_through.
    rationale: _pass_through is still the correct, deliberate choice for IOTA and Binance Coin for entirely unrelated reasons (no installed decoder) -- changing its behavior would risk those coins too. A dedicated function keeps the blast radius to exactly the 4 coins that share the "0x" shape.
  - decision: Extreme, conservative thresholds (≤2 non-zero bytes; 100% printable-ASCII), not lenient percentage cutoffs.
    rationale: Matches this file's own explicit stated principle ("false negatives are strictly worse than the bug being fixed") -- the goal is catching only cases that are essentially impossible for a genuine address, not maximizing catch rate.

