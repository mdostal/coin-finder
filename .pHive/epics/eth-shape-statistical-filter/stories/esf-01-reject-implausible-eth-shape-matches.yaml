risks:
  - severity: high
    description: Too-aggressive thresholds could reject a real, legitimate address, directly contradicting this project's core purpose.
    mitigation: Deliberately extreme thresholds (documented above) plus a test asserting several known-real historical Ethereum addresses are still accepted -- this is the single most important test in this story, treat it as the actual acceptance bar, not a formality.

references:
