id: gmc-01-attach-dedicated-oauth-credentials
epic: gdrive-mount-configuration
title: Attach a dedicated Google OAuth client to an existing remote
status: shipped
complexity: medium
methodology: tdd
depends_on: []

description: |
  The "Dostal Drive" gdrive remote was created without a dedicated
  client_id/client_secret, so every mount authenticates through rclone's
  shared default Google API client. That client's quota is global across
  every rclone user on earth -- under sustained scan load it 403s
  (RATE_LIMIT_EXCEEDED), which is the root cause of the mount dying every
  20-30 minutes (confirmed live, documented in web/mounts.py's mount()
  docstring: "The durable fix is a personal Google Cloud OAuth client
  (its own dedicated quota) via create_remote()'s client_id/client_secret
  -- this tuning is a mitigation, not a replacement for that.").

  create_remote() (web/rclone_wizard.py) already accepts client_id/
  client_secret and already validates + vaults the secret correctly --
  but it's only ever called at first-time remote creation
  (POST /wizard/cloud/connect). There is currently no way to attach
  credentials to a remote that already exists. This story adds that path:
  a new action on the Mounts page that updates an existing remote's
  OAuth client in place (rclone config update, not delete-and-recreate,
  so the remote name / any bound targets survive) and re-runs the OAuth
  flow with the new client.

  Also add in-app, step-by-step instructions for getting a client_id/
  client_secret from Google Cloud Console (enable the Drive API, create
  an OAuth consent screen, create an OAuth client) -- this is real manual
  work only the user can do (clicking through Google's own UI), so the
  story's job is to make that path unambiguous, not to automate it.

acceptance_criteria:
  - "Given an existing remote with no client_id set, when the user submits a valid client_id + client_secret on the Mounts page, then rclone's remote config is updated in place (same remote name) and a fresh OAuth flow starts for the new client."
  - "Given an existing remote that already has custom credentials, when the user submits new ones, then the old credentials are replaced (not appended) and re-auth happens against the new client."
  - "Given a client_id that fails _looks_like_google_client_id() validation, when submitted, then the request is rejected before any subprocess call, same as create_remote()'s existing validation."
  - "Given the update or re-auth fails partway, when it errors, then the remote is left in its prior working state (not partially updated / not deleted) -- this must not repeat the create_remote() partial-failure bug that cloud-connection-reliability (ccr-01) already fixed for creation."
  - "Given a user with no dedicated credentials yet, when they view the new UI section, then they see numbered steps for getting a client_id/client_secret from Google Cloud Console, written for someone who has never used Cloud Console before."

steps:
  - id: research
    description: Confirm rclone's `config update` semantics for changing client_id/client_secret on an existing remote without losing the remote's OAuth token/name, and whether re-auth must be triggered as a separate step.
    agent: researcher
  - id: test-spec
    description: |
      Write failing tests for: validation rejects a bad client_id before any subprocess call; a successful update leaves exactly one remote of that name in rclone's config; a failed update/re-auth does not leave the remote broken or removed.
    agent: tester
    depends_on: [research]
  - id: implement
    description: |
      Add an update_remote_credentials() function alongside create_remote() in web/rclone_wizard.py reusing its validation (_looks_like_google_client_id) and vault-backed secret handling. Wire a new POST /mounts/update-credentials route in web/app.py backgrounded via create_job/start_job like _run_connect_remote_job. Add the form + Google Cloud Console step-by-step instructions to web/templates/mounts.html.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Review implementation and tests for correctness and convention compliance
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch
    agent: developer
    depends_on: [review]

