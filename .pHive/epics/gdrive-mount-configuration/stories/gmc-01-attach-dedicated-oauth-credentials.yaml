code_examples:
  - title: Existing client_id validation + vault-backed secret pattern to reuse
    file: web/rclone_wizard.py
    snippet: |
      def _looks_like_google_client_id(client_id: str) -> bool:
          return client_id.endswith(".apps.googleusercontent.com")
      # ... in create_remote():
      if client_id and not _looks_like_google_client_id(client_id):
          raise ValueError(...)
      if client_id and client_secret:
          # secret goes to vault, never a raw CLI arg/log
          resolved_secret = add_vault_entry(...)
          args += ["client_id", client_id, "client_secret", resolved_secret]

design_decisions:
  - decision: Use `rclone config update`, not delete-and-recreate, for attaching credentials to an existing remote.
    rationale: Preserves the remote name and anything already bound to it (targets, mount-log history) -- a delete+recreate would silently break those references.
  - decision: In-app instructions for Google Cloud Console, not just a README link.
    rationale: The user has to do this manual step themselves; friction here directly determines whether the real fix actually gets used instead of being skipped for "just remount it again."

cross_cutting:
  - concern: documentation
    action: "Update README.md's Mounting Google Drive section (~line 784-825) to document attaching dedicated credentials to an existing remote, once implemented."

metric:
  applies: false
  justification: "Infra/config story with no independent observable product metric of its own -- its effect (mount no longer rate-limited) is what gmc-02's test-mount story actually measures."

risks:
  - severity: medium
    description: A failed rclone config update could leave the remote in a broken intermediate state (name present, no valid token).
    mitigation: Verify the updated remote with a real read (same rclone lsd pattern ccr-01 already added to create_remote()) before declaring success; on any failure, leave the remote's prior config file untouched rather than deleting it.
  - severity: low
    description: User pastes a client_secret from a client_secret_....json download instead of the bare secret string.
    mitigation: The step-by-step instructions should show exactly which field to copy from Google Cloud Console's OAuth client detail page.

