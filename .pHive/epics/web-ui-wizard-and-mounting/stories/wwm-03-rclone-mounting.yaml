design_decisions:
  - decision: Mounts are read-only, always.
    rationale: This app only ever needs to scan Drive/GCS content, never write to it -- a read-only mount makes "accidentally modify the user's real cloud storage" structurally impossible rather than a convention to remember.
  - decision: Mounts are tracked as persistent background processes, not web/jobs.py jobs.
    rationale: A job models "start, run, finish with a result" -- a mount is "start, stay running indefinitely until explicitly stopped." Forcing it into the job model would need a fake never-completing job; a small dedicated state file is a better fit.
  - decision: is_mounted() checks real process/mount health, not just path existence.
    rationale: A crashed FUSE mount is a known failure mode that leaves a path that *looks* fine but silently reads as empty -- a scan against a dead mount would misreport "found nothing" as if the Drive were genuinely empty. This must be caught before a scan starts, not discovered after a wasted multi-day crawl.

risks:
  - severity: high
    description: A scan running against a mount that dies partway through could silently produce an incomplete/misleading result (looks like "scanned everything, found nothing" rather than "scan was cut short").
    mitigation: is_mounted() health check surfaced prominently on /mounts before starting a scan; documented as a known risk for multi-day crawls in the README's mounting section -- recommend checking /mounts periodically during a long crawl, not a false guarantee of resilience this story can't actually provide.
  - severity: medium
    description: macFUSE's manual OS approval step is a real point where a non-technical user could get stuck with no clear next action.
    mitigation: install_rclone.sh's explicit callout + the /mounts page's is_mounted() check giving a clear "not yet approved" signal rather than a silent failure.

references:
