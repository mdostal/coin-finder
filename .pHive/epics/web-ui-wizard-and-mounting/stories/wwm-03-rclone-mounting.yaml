id: wwm-03-rclone-mounting
epic: web-ui-wizard-and-mounting
title: rclone-based Google Drive/GCS mounting
status: complete
complexity: large
methodology: tdd
depends_on: [wwm-02-bound-targets-and-volumes]

description: |
  scripts/install_rclone.sh: `brew install rclone` + `brew install --cask
  macfuse`, printing a loud, explicit callout that macFUSE requires manual
  approval in System Settings -> Privacy & Security (and typically a
  reboot) -- verified live during epic research that this step cannot be
  scripted past.

  web/mounts.py: wraps `rclone` as a long-running background process (not a
  web/jobs.py job -- a mount is a persistent daemon, not a one-shot task
  with a result):
  - list_remotes(): `rclone listremotes` -- configured remotes (Drive/GCS),
    parsed output.
  - mount(remote_name, mount_point): starts `rclone mount <remote>:
    <mount_point> --read-only --vfs-cache-mode=minimal` as a background
    subprocess (read-only -- this app only ever scans, never writes to
    Drive/GCS). Tracked in a small local state file
    (web/mounts_state.json, gitignored): {remote_name: {pid, mount_point,
    started_at}}.
  - unmount(remote_name): `umount <mount_point>` (macOS), removes the state
    entry.
  - is_mounted(remote_name): checks the tracked process is actually alive
    AND the mount point responds (not just "does the path exist" -- a
    crashed FUSE mount can leave a path that exists but reads as
    permanently empty, a real documented FUSE failure mode).

  New page GET /mounts: lists configured remotes (from list_remotes()) and
  their mount status, mount/unmount buttons, and on a successful mount, an
  "Add to bound targets" button wired directly into wwm-02's
  add_target(path, kind="gdrive-mount"|"gcs-mount").

acceptance_criteria:
  - "Given a mocked rclone listremotes output, when list_remotes runs, then it returns the parsed remote names"
  - "Given a mocked subprocess, when mount() is called, then it starts rclone with --read-only and records the process in the state file"
  - "Given a tracked mount whose process has died, when is_mounted() runs, then it returns False, not just checking path existence"
  - "Given a successful mount, when 'Add to bound targets' is used, then it calls wwm-02's add_target with kind matching the remote type"
  - "Given install_rclone.sh runs, when it completes, then it prints the macFUSE manual-approval callout -- this is asserted by a test that runs the script with a mocked/stubbed brew and greps its output"

