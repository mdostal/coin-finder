  - file: README.md
    change: wizard walkthrough section

design_decisions:
  - decision: The wizard delegates to existing routes/functions at every step rather than reimplementing scan-trigger, mount, or bind logic inline.
    rationale: A second parallel implementation of "start a scan" or "bind a target" living inside the wizard would drift from the main flows over time -- the wizard's entire value is sequencing and explaining what already exists, not duplicating it.
  - decision: Every "success" message in the wizard is gated on an actual state check, never on "the command didn't throw."
    rationale: Directly addresses wwm-03's highest-severity risk (a wizard confidently telling a non-technical user "Drive mounted!" when it silently isn't, right before a multi-day crawl that would report false-empty results).

risks:
  - severity: medium
    description: A 4-story epic's final integration story is the one most likely to reveal gaps in the prior three (e.g. a bind-path mismatch between wwm-02 and wwm-03).
    mitigation: This story explicitly reuses wwm-02/03's functions rather than re-deriving target/mount shapes, so any mismatch surfaces as a test failure here rather than a silent runtime inconsistency.

references:
  - path: .pHive/epics/web-ui-wizard-and-mounting/docs/design-discussion.md
    relevant_excerpt: "This is the \"integration\" slice -- it doesn't add new scanning/mounting mechanics, it sequences stories 2 and 3 into one guided path"
