id: wwm-02-bound-targets-and-volumes
epic: web-ui-wizard-and-mounting
title: Bound/saved scan targets + mounted-volume detection
status: pending
complexity: medium
methodology: tdd
depends_on: []

description: |
  web/bound_targets.py: a small JSON-file-backed store
  (web/bound_targets.json, gitignored -- local runtime state):
  - add_target(label, path, kind) / list_targets() / remove_target(label) --
    kind is one of "local", "volume", "gdrive-mount", "gcs-mount"
    (informational only; every kind is scanned identically once it's a
    filesystem path).
  - list_mounted_volumes(): macOS-specific, enumerates /Volumes/* excluding
    the boot volume (Macintosh HD-style root), returning
    [{name, path, is_bound}] -- is_bound cross-references the bound-targets
    store so an already-added volume isn't offered twice.

  New page GET /targets: lists bound targets and detected-but-unbound
  volumes side by side. Each row has a "Scan" button that POSTs straight to
  the existing /scan route (no new scanning logic) and, for unbound
  volumes, an "Add" button (POST /targets/add) that calls add_target and
  re-renders. POST /targets/remove removes a bound target (does not touch
  the underlying files/volume -- only the saved reference).

acceptance_criteria:
  - "Given a fresh bound_targets.json (or none), when add_target is called, then the file is created and the target is listed"
  - "Given a bound target, when remove_target is called, then it's gone from list_targets() and the underlying path is untouched"
  - "Given a mocked /Volumes listing, when list_mounted_volumes runs, then the boot volume is excluded and already-bound volumes are marked is_bound=true"
  - "Given the /targets page, when a bound target's Scan button is used, then it POSTs to the existing /scan route with that target's path"

steps:
  - id: research
    description: (Already completed live in docs/research-brief.md.)
    agent: researcher
  - id: test-spec
    description: Write failing tests in tests/test_bound_targets.py (file-backed store, tmp_path-based) and tests/test_web_app_targets.py (route tests, mocked list_mounted_volumes for macOS-independence).
    agent: tester
    depends_on: [research]
  - id: implement
    description: Implement web/bound_targets.py and the /targets routes/template.
