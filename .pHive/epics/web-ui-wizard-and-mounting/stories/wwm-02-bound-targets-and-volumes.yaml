design_decisions:
  - decision: kind is informational only -- scanning logic never branches on it.
    rationale: search_wallets.py/find_seed_phrases.py already work identically against any local-looking directory (local disk, physical volume, or a later FUSE mount) -- kind exists for the UI to explain what a target is, not to change how it's scanned.
  - decision: remove_target only removes the saved reference, never the underlying path/files.
    rationale: A "remove" action that could be misread as "delete this drive's data" would be a serious safety regression in a project built entirely around not losing real money -- this must be structurally impossible, not just documented.

risks:
  - severity: low
    description: /Volumes enumeration is macOS-specific.
    mitigation: Stated, not silent -- list_mounted_volumes() returns an empty list with a clear "volume detection is macOS-only" note on other platforms rather than erroring.

references:
