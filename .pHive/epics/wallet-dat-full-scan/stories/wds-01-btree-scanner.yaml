files_to_modify:
  - file: tools/scan_wallet_dat.py
    change: new file -- read_btree_key_items, decode_bdb_key_record, pubkey_to_address, scan_wallet_for_addresses, check_addresses_balances, CLI
  - file: tests/test_scan_wallet_dat.py
    change: new file -- synthetic BDB fixture tests, read-bounding test, balance-check tests

design_decisions:
  - decision: Only ever read the BDB key half of any record; value positions are skipped via length-header arithmetic, never read.
    rationale: Every address this tool needs lives in the key half (pubkey for "key"/"ckey" records, address string for "name" records); structurally excluding value reads means private-key bytes are never loaded into memory during the scan, not merely ignored after loading.
  - decision: pool/keymeta records are counted but not deep-parsed in v1.
    rationale: key + name records already cover the highest-confidence address set; deferred as a stated follow-up rather than silently dropped.

risks:
  - severity: critical
    description: A bug that reads a value position for a key/ckey record would load a raw private key into memory.
    mitigation: Structural safety property (position tracked, read() only called for value positions on non-key-bearing tags like "name"'s label, which this tool doesn't even need); explicit review step and a dedicated read-call-counting test.
  - severity: medium
    description: Checking 1000+ addresses live could take a long time / press rate limits.
    mitigation: --limit flag for bounded first passes, always reported when applied.

references:
  - path: .pHive/epics/wallet-dat-full-scan/docs/design-discussion.md
    relevant_excerpt: |
      "Every address this tool needs (from both record types) lives in the
      BDB key half, never the value half. The scanner is therefore
      structured to never call .read() on a value's file position at all."
