id: wds-01-btree-scanner
epic: wallet-dat-full-scan
title: Safe BDB key enumeration + address derivation + balance scan
status: completed
complexity: high
methodology: tdd
depends_on: []

description: |
  New module tools/scan_wallet_dat.py:

  - `read_btree_key_items(wallet_path) -> list[bytes]`: walks the BDB btree
    (validated algorithm from live research against the real wallet file --
    magic-byte check, page-size read, leaf-page detection type=5/level=1,
    item header (len,type) parsing, 32-bit-aligned position arithmetic).
    SAFETY-CRITICAL: for each key/value pair, only the KEY half is ever
    `.read()` from disk; the VALUE half's file position is skipped via
    length-header arithmetic alone, never read into memory. Returns the raw
    key bytes for every non-deleted item.
  - `decode_bdb_key_record(key_bytes) -> dict`: decodes Bitcoin Core's
    CDataStream tag+payload serialization (compact-size length prefix, per
    Bitcoin's WriteCompactSize: 1 byte if <253). For tag in ("key", "ckey"):
    `{"type": tag, "pubkey": bytes}`. For tag == "name":
    `{"type": "name", "address": str}`. Otherwise: `{"type": tag}`.
  - `pubkey_to_address(pubkey_bytes) -> str`: `bip_utils.P2PKHAddrEncoder
    .EncodeKey(pubkey_bytes, net_ver=b"\x00")` -- reused from
    match_seed_phrases.py's established pattern, verified live against the
    standard BIP44 test vector.
  - `scan_wallet_for_addresses(wallet_path) -> dict`: orchestrates the above.
    Returns `{"addresses": [{"address": str, "source": "key"|"name"}, ...]
    (deduplicated), "encrypted_key_count": int, "unparsed_record_types":
    {tag: count}}`. If encrypted_key_count > 0, the wallet has ckey records
    (encrypted) -- addresses are still safely derivable from their pubkeys,
    but the report must state that a password (via unlock_wallet.py) is
    needed to actually spend from them.
  - `check_addresses_balances(addresses, limit=None) -> list[dict]`: reuses
    `_check_balance_with_retries` + `BitcoinService`. When `limit` is set and
    fewer than the full address count is checked, the result/report states
    this explicitly -- never silent truncation.
  - CLI: `python tools/scan_wallet_dat.py <wallet_path> <output_file>
    [--limit N]`.

acceptance_criteria:
  - "Given a hand-constructed BDB key-record byte sequence for tag 'key' with a known pubkey, when decode_bdb_key_record runs, then it returns {'type': 'key', 'pubkey': <the exact pubkey bytes>}"
  - "Given a hand-constructed BDB key-record byte sequence for tag 'name' with a known address string, when decode_bdb_key_record runs, then it returns {'type': 'name', 'address': <the exact address string>}"
  - "Given a hand-constructed BDB key-record byte sequence for an unrecognized tag, when decode_bdb_key_record runs, then it returns {'type': tag} without raising"
  - "Given the standard public BIP44 test-vector pubkey, when pubkey_to_address runs, then it returns the exact publicly documented test-vector address"
  - "Given a synthetic single-page BDB-shaped fixture built in the test file (constructed from the validated real-file format, containing one 'key' pair and one 'name' pair), when read_btree_key_items runs, then it returns exactly those two key-byte sequences and never calls .read() at a value's file position (verified via a read-call-counting monkeypatch of open(), mirroring the pattern from dcv-01's read-bounding test)"
  - "Given a mocked BitcoinService returning a non-zero balance for one address among several, when check_addresses_balances runs, then that entry's balance reflects it and a limit, when set below the full address count, is stated in the returned/reported data"
  - "Given a wallet scan that includes ckey (encrypted) records, when scan_wallet_for_addresses runs, then encrypted_key_count reflects the count and the CLI's report states a password is needed to spend from those addresses"

steps:
  - id: research
    description: (Already completed via live diagnostic runs against the real wallet.dat during epic research -- documented in docs/design-discussion.md.) Re-confirm the exact byte offsets/struct formats before writing tests.
    agent: researcher
  - id: test-spec
    description: |
      Write failing tests in tests/test_scan_wallet_dat.py using
      hand-constructed byte fixtures (no real wallet file needed for the
      core parsing tests) and the standard public BIP44 test vector for
      pubkey_to_address. Include the read-call-counting test verifying value
      bytes are never read for key/ckey pairs.
    agent: tester
    depends_on: [research]
  - id: implement
    description: Implement read_btree_key_items, decode_bdb_key_record, pubkey_to_address, scan_wallet_for_addresses, check_addresses_balances, and the CLI to make the failing tests pass. Do not modify the tests.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Review specifically and carefully that no code path reads a value position for a key/ckey record under any circumstance -- this is the story's most important property. Also verify the --limit truncation is always reported, never silent.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit tools/scan_wallet_dat.py and tests/test_scan_wallet_dat.py. Manually run a BOUNDED (--limit 30) real scan against the actual backup-wallet-1/wallet.dat to sanity-check real output -- not a full 1000+-address sweep in this session.
    agent: developer
    depends_on: [review]

