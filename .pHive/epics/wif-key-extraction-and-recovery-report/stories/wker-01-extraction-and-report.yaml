design_decisions:
  - decision: Sweeping funds is explicitly NOT this project's job -- extraction stops at a WIF file, with instructions to import into Electrum and use Electrum's own sweep function.
    rationale: Hand-rolling UTXO selection, fee estimation, transaction signing, and broadcast is a large amount of new financial-transaction-critical code where a bug is irreversible once broadcast. Delegating that step to well-audited, widely-used software (Electrum) keeps this project's own custom code out of the highest-consequence part of the pipeline.
  - decision: A Bitcoin Core `bitcoin-wallet`/`migratewallet`-based approach (native, never touches raw key bytes ourselves) was tried first and abandoned.
    rationale: `bitcoin-wallet dump` on the current Homebrew build only supports SQLite-format dumps for `createfromdump`; loading the original legacy BDB wallet requires the `migratewallet` RPC, which failed with "Address book data in wallet cannot be identified to belong to migrated wallets" against every available real-shaped test wallet.dat. This is a real, encountered failure mode, not a hypothetical -- documented here so a future attempt at the Core-native path knows this dead end.
  - decision: Manual fixed-field DER parsing instead of `cryptography`'s general DER/EC-key loader.
    rationale: That loader refuses Bitcoin Core's explicit-curve-parameter secp256k1 encoding by design (an anti-footgun policy for arbitrary curves, not a bug). The fields this tool actually needs (version, 32-byte private key OCTET STRING) are fixed and asserted against expected values; the pre-existing self-verification round-trip in extract_wif_for_address is the independent correctness backstop regardless.

risks:
  - severity: critical
    description: A bug in DER/value-byte parsing could produce a wrong or corrupted private key.
    mitigation: Self-verification round-trip (re-derive address, refuse on mismatch) inside extract_wif_for_address itself -- not just tests, a runtime guarantee. Validated against 16 real addresses from the actual target wallet before any real balance was touched.
  - severity: high
    description: Extracting a real private key while online exposes it to a materially larger attack surface than an offline machine.
    mitigation: Hard offline gate, identical discipline to unlock_wallet.py/unlock_exodus_wallet.py; the tool never prints the key, only writes it to a local file.
  - severity: medium
    description: This tool only handles UNENCRYPTED "key" records -- the real target wallet happens to be unencrypted, but this won't help with any encrypted wallet found later.
    mitigation: Explicitly refuses ckey records with a clear pointer to unlock_wallet.py (BTCRecover) instead of silently mishandling them -- a stated gap, not a silent one.

