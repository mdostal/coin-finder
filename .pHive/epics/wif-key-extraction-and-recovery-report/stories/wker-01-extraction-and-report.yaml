description: |
  tools/extract_private_key.py:
  - find_key_value_pair_for_address(wallet_path, target_address): walks the
    same BDB leaf-page structure as scan_wallet_dat.py's
    read_btree_key_items, this time also capturing the paired VALUE-half
    bytes for the one key/ckey item matching target_address -- every other
    value-half in the file stays unread.
  - decode_cprivkey_to_wif(value_bytes, compressed): value_bytes is
    compact_size(len) + DER CPrivKey + trailing metadata. Cross-validates
    the compact-size-declared length against the DER SEQUENCE's own
    self-described length before trusting the slice, then extracts the raw
    32-byte private key via a minimal, self-validating fixed-field parse
    (SEQUENCE -> INTEGER version=1 -> OCTET STRING[32]) -- not a
    general-purpose DER/EC-key loader, because `cryptography`'s own loader
    refuses Bitcoin Core's explicit-curve-parameter secp256k1 encoding.
  - extract_wif_for_address(wallet_path, target_address, allow_online=False):
    hard offline gate (same discipline as unlock_wallet.py); refuses
    encrypted (ckey) records with a clear error; self-verifies by
    re-deriving the address from the produced WIF and refusing to return
    anything that doesn't match target_address exactly.
  - CLI: python tools/extract_private_key.py <wallet_path> <address>
    <output_file> [--allow-online]. Never prints the key -- writes to a
    local file only, then prints next-step guidance (import into Electrum,
    sweep to a fresh address).

  tools/generate_wallet_report.py:
  - identify_wallet_software(wallet_path): deterministic from file magic
    bytes (Bitcoin Core BDB Btree v9, or "Unknown").
  - build_wallet_report(wallet_path, target_addresses=None, now=None):
    file metadata, software, encryption status, and (only for explicitly
    passed target_addresses, to avoid an accidental full-wallet on-chain
    crawl) public on-chain dormancy via crawl_transaction_graph.py's
    existing functions.
  - render_wallet_report(report): Markdown report pointing back to
    docs/wallet_recovery_reference.md for the self-custody-vs-custodial
    judgment call this project's tools can't automate.
  - CLI: python tools/generate_wallet_report.py <wallet_path> <output_file>
    [--address ADDR ...].

  Real-data validation performed during this story (documented here since
  it's the actual evidence this code is trustworthy, not just that tests
  pass): extract_wif_for_address run with --allow-online against
  backup-wallet-1/wallet.dat for 16 different zero-balance addresses
  (1 initial + a 15-address random sample) -- 16/16 produced a WIF that
  round-tripped back to the exact same address. Real extraction of the
  actual funded address ([REDACTED-REAL-ADDRESS]) is left to a
  separate, explicit, offline run -- not part of this story's automated
  work, per the offline-gate discipline this whole project follows for real
  secret material.

acceptance_criteria:
  - "Given a synthetic wallet with a known keypair, when find_key_value_pair_for_address runs, then it returns exactly that keypair's value bytes, not a neighboring pair's"
  - "Given the machine is online, when extract_wif_for_address runs without --allow-online, then it raises before touching any key material"
  - "Given a real (but zero-balance) address from a real wallet.dat, when extract_wif_for_address runs offline, then the produced WIF decodes back to the exact same address"
  - "Given both compressed and uncompressed pubkey records, when decode_cprivkey_to_wif runs, then the WIF's compression flag matches and round-trips correctly"
  - "Given an address in an encrypted (ckey) record, when extract_wif_for_address runs, then it refuses with a clear error rather than misinterpreting encrypted bytes as a DER key"
  - "Given a wallet.dat's magic bytes, when identify_wallet_software runs, then it returns a deterministic software identification or an explicit Unknown"

