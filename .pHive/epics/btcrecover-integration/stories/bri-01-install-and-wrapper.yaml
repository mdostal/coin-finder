files_to_modify:
  - file: scripts/install_btcrecover.sh
    change: new file -- clones/updates 3rdIteration/btcrecover into vendor/, installs its deps
  - file: tools/unlock_wallet.py
    change: new file -- check_network_status, find_btcrecover_script, run_unlock, CLI
  - file: tests/test_unlock_wallet.py
    change: new file -- safety-gate tests + real end-to-end test against BTCRecover's public fixture
  - file: .gitignore
    change: add vendor/ (external tool, not committed)

design_decisions:
  - decision: Hard-block the real recovery run when the machine is online, requiring an explicit --allow-online override.
    rationale: Directly implements BTCRecover's own upstream SKILL.md separation principle -- a single online session must never combine wallet file + password candidates in a way that could unlock funds while online.
  - decision: vendor/btcrecover/ is fetched at setup time, not committed to this repo's git history.
    rationale: It's a large, separately-maintained GPLv2 project; matches how the project already excludes /output/** and /input/** from version control.

risks:
  - severity: critical
    description: Running a real password-guessing attempt against a real wallet while online is the exact failure mode the upstream SKILL.md exists to prevent.
    mitigation: Hard --allow-online gate (default blocked); this epic's own testing never runs against the user's real wallet, only BTCRecover's public test fixture.
  - severity: medium
    description: vendor/btcrecover/ tracks upstream HEAD rather than a pinned version: behavior could shift if upstream changes.
    mitigation: Accepted for v1 per the user's explicit ask for a live install step; a version pin is a reasonable low-effort follow-up if drift becomes a problem.

references:
  - path: .pHive/epics/btcrecover-integration/docs/design-discussion.md
    relevant_excerpt: |
      "The real recovery run must happen with network disabled; only
      install/validation may happen online... I build and test the tool;
      the user runs the actual real-wallet recovery themselves, offline."
