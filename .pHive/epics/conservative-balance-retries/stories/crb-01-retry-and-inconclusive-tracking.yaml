code_examples:
  - title: Existing None-on-failure contract every service follows
    file: services/bitcoin.py
    snippet: |
      def check_balance(self, address):
          try:
              response = requests.get(url)
              if response.status_code != 200:
                  return None
              data = response.json()
              return (funded - spent) / 1e8  # can legitimately be 0.0
          except Exception as e:
              print(f"Error checking Bitcoin balance: {e}")
              return None

design_decisions:
  - decision: Retry at the orchestration layer (check_wallet_balances.py), not inside each of the 21 service files.
    rationale: One fix covers every coin uniformly with zero service-file edits -- lowest blast-radius option, per design-discussion.md Section 3.
  - decision: Only retry when the result is None; a confirmed float (including 0.0) returns immediately.
    rationale: Avoids wasting API calls/quota on addresses that already have a confirmed answer.

risks:
  - severity: medium
    description: Retries make real pipeline runs slower against flaky/rate-limited APIs (up to 3x calls per address on failure, plus backoff sleep).
    mitigation: Deliberate tradeoff per north-star ask (thoroughness over speed); constants are easy to tune later.
  - severity: low
    description: Retrying on None doesn't distinguish "will succeed on retry" from "permanently invalid address" since services only expose None, not status codes.
    mitigation: Explicitly out of scope for this epic -- would require touching all 21 services.

