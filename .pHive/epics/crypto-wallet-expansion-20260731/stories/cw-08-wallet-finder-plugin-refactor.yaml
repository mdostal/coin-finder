code_examples:
  - title: Plugin route registration
    snippet: |
      from plugins.base import BasePlugin
      from fastapi import APIRouter

      class WalletFinderPlugin(BasePlugin):
          name = "wallet_finder"
          version = "2.0.0"

          def get_routes(self):
              router = APIRouter(prefix="/api/wallet_finder")
              router.add_api_route("/wallets", self.list_wallets, methods=["GET"])
              router.add_api_route("/scan", self.start_scan, methods=["POST"])
              router.add_api_route("/graph/{address}", self.get_graph, methods=["GET"])
              return [router]

design_decisions:
  - decision: CLI tools become thin wrappers calling plugin methods
    rationale: Maintains backward compatibility, reduces duplication, single source of truth
  - decision: Plugin owns database session management
    rationale: Encapsulation - plugin responsible for data persistence lifecycle
  - decision: Async API routes for long-running operations (scan, graph traversal)
    rationale: Prevents request timeouts, enables progress reporting

risks:
  - severity: medium
    description: Refactor may introduce regressions in existing CLI functionality
    mitigation: Comprehensive integration tests, parallel deployment (old + new), gradual migration
  - severity: low
    description: Breaking abstraction boundaries between tools and plugin
    mitigation: Clear interface contracts, code review for dependency direction violations

