code_examples:
  - title: React router with plugin navigation
    snippet: |
      import { BrowserRouter, Routes, Route } from 'react-router-dom';
      import { useEffect } from 'react';
      import { useStore } from './store';
      import Navigation from './components/Navigation';

      function App() {
        const { plugins, loadPlugins } = useStore();

        useEffect(() => {
          loadPlugins();
        }, []);

        return (
          <BrowserRouter>
            <Navigation items={plugins.flatMap(p => p.navItems)} />
            <Routes>
              {/* Plugin routes dynamically registered */}
            </Routes>
          </BrowserRouter>
        );
      }

design_decisions:
  - decision: TypeScript over JavaScript
    rationale: Type safety reduces runtime errors, better IDE support, self-documenting APIs
  - decision: Zustand over Redux/Context API
    rationale: Simpler API, less boilerplate, sufficient for medium-complexity state
  - decision: axios over fetch
    rationale: Better error handling, request/response interceptors, timeout support
  - decision: Build output to frontend/build/, served by FastAPI
    rationale: Single deployment artifact, no CORS in production

risks:
  - severity: low
    description: WebSocket disconnects not handled gracefully
    mitigation: Reconnection logic with exponential backoff, user notification on disconnect
  - severity: low
    description: Large bundle size from Recharts + ReactFlow
    mitigation: Code splitting, lazy loading of graph visualization components

