title: Design and implement BasePlugin interface
status: pending
complexity: medium
methodology: classic
depends_on: []

description: |
  Create plugin system foundation with BasePlugin abstract class defining standard
  hooks (initialize, get_routes, get_nav_items, on_event). Implement plugin registry
  with auto-discovery from plugins/ directory and YAML-based configuration management.

acceptance_criteria:
  - "Given a plugin inheriting BasePlugin, when loaded, then initialize() called once"
  - "Given plugin.get_routes(), when registered, then routes accessible at /api/{plugin_name}/*"
  - "Given plugin.get_nav_items(), when rendered, then dashboard navigation includes items"
  - "Given event published, when plugin subscribes, then on_event() callback fired"
  - "Given config/plugins.yaml, when plugin disabled, then not loaded by registry"

