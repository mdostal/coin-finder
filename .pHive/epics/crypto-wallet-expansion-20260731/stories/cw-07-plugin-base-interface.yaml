code_examples:
  - title: BasePlugin interface
    snippet: |
      from abc import ABC, abstractmethod

      class BasePlugin(ABC):
          name: str
          version: str
          config: dict

          def initialize(self):
              """Called when plugin is loaded."""
              pass

          @abstractmethod
          def get_routes(self):
              """Return list of (method, path, handler) tuples."""
              return []

          def get_nav_items(self):
              """Return dashboard nav items."""
              return []

          def on_event(self, event_type, data):
              """Handle events from other plugins."""
              pass

design_decisions:
  - decision: YAML-based plugin config over Python decorators
    rationale: Non-developers can enable/disable plugins without touching code
  - decision: Simple event bus over message queue (Redis, RabbitMQ)
    rationale: Single-process deployment for MVP, avoid external dependencies
  - decision: Plugin routes namespaced under /api/{plugin_name}/
    rationale: Prevents route collisions, clear ownership of endpoints

risks:
  - severity: medium
    description: Plugin API breaking changes disrupt third-party plugins
    mitigation: Semantic versioning, deprecation warnings, compatibility matrix in docs
  - severity: low
    description: Malicious plugins can access database directly
    mitigation: Document security model (plugins are trusted code), sandboxing in Phase 2

