code_examples:
  - title: Etherscan API pattern
    snippet: |
      import os
      from dotenv import load_dotenv
      load_dotenv()

      api_key = os.getenv("ETHERSCAN_API_KEY")
      url = f"https://api.etherscan.io/api?module=account&action=txlist&address={address}&apikey={api_key}"
      response = requests.get(url)
      if response.json()["status"] != "1":
          return None

design_decisions:
  - decision: Combine ETH and ERC-20 TXs in single get_transactions() response
    rationale: User expects all value transfers, both native and tokens, in unified view
  - decision: Store token symbol in Transaction.metadata_json field
    rationale: Token transfers need symbol (USDT, SHIB, etc.) but base schema is coin-agnostic
  - decision: Require ETHERSCAN_API_KEY for transaction history but not balance checking
    rationale: Balance can use public endpoint, TX history rate-limited on free tier

risks:
  - severity: medium
    description: Free tier limited to 5 req/sec, can hit limits quickly on multi-wallet scans
    mitigation: Implement token bucket rate limiter, cache responses, offer paid tier docs
  - severity: low
    description: Internal transactions require separate API call (/api?module=account&action=txlistinternal)
    mitigation: Document as Phase 2 feature, focus on external TXs for MVP

