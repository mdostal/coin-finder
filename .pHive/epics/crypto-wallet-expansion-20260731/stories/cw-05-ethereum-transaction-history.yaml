status: pending
complexity: medium
methodology: classic
depends_on: [cw-03-bitcoin-transaction-history]

description: |
  Implement get_transactions() and get_transaction_detail() for EthereumService using
  Etherscan API. Handle ERC-20 token transfers alongside ETH transfers. Respect API
  key rate limits (5 req/sec free tier). Normalize response format to match Bitcoin
  implementation for consistency.

acceptance_criteria:
  - "Given an Ethereum address, when get_transactions called, then both ETH and ERC-20 transfers returned"
  - "Given ETHERSCAN_API_KEY in .env, when API called, then authentication succeeds"
  - "Given rate limit (5 req/sec), when multiple requests made, then pacing prevents 429 errors"
  - "Given internal transactions (contract calls), when included, then flagged separately from external TXs"
  - "Given gas fees, when transaction parsed, then fee stored in Transaction.fee field"

