code_examples:
  - title: Wallet table with sorting
    snippet: |
      interface Wallet {
        address: string;
        coinType: string;
        balance: number;
        filePath: string;
        confidence: number;
        createdAt: string;
      }

      function WalletTable({ wallets }: { wallets: Wallet[] }) {
        const [sortBy, setSortBy] = useState('balance');
        const [sortDesc, setSortDesc] = useState(true);

        const sorted = [...wallets].sort((a, b) => {
          const aVal = a[sortBy];
          const bVal = b[sortBy];
          return sortDesc ? bVal - aVal : aVal - bVal;
        });

design_decisions:
  - decision: Client-side filtering/sorting over server-side
    rationale: Simpler implementation, acceptable latency for <10k wallets, reduces API calls
  - decision: 50 wallets per page default
    rationale: Balance between scrolling and page load count, configurable by user
  - decision: Sticky table header
    rationale: Column labels always visible while scrolling, better UX for large tables

risks:
  - severity: low
    description: Client-side filtering slow with 10k+ wallets
    mitigation: Server-side pagination/filtering in Phase 2, virtual scrolling option

