code_examples:
  - title: BFS traversal pattern
    snippet: |
      from collections import deque

      def trace_relationships(seed_address, coin_type, max_hops=2):
          queue = deque([(seed_address, 0)])
          visited = set()
          graph = defaultdict(list)

          while queue:
              current_addr, depth = queue.popleft()
              if depth > max_hops or current_addr in visited:
                  continue
              visited.add(current_addr)

              service = load_service(coin_type)
              txs = service.get_transactions(current_addr)

              for tx in txs:
                  if tx['to'] == current_addr:
                      graph[tx['from']].append(current_addr)

design_decisions:
  - decision: BFS over DFS for traversal
    rationale: Want all wallets at hop N before exploring hop N+1, better for progressive visualization
  - decision: Store visited set to prevent cycles
    rationale: Circular transactions common (exchange wallets, change addresses), must avoid infinite loops
  - decision: Sort transactions by timestamp descending before traversal
    rationale: Recent relationships more relevant, oldest TXs may be dust/spam
  - decision: Separate in-edges and out-edges in graph structure
    rationale: Directional relationships critical (sent_to vs received_from)

risks:
  - severity: high
    description: Exchange wallets with 10k+ TXs cause exponential explosion
    mitigation: max_txs_per_wallet cap, heuristic detection (>500 unique counterparties = likely exchange, skip)
  - severity: medium
    description: Long-running traversals (minutes) block CLI
    mitigation: Progress indicator, async background job option in Phase 2
  - severity: low
    description: Memory usage for large graphs (1000+ wallets)
    mitigation: Generator-based traversal for streaming results, disk-backed graph option

