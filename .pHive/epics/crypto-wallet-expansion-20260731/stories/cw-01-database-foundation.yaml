code_examples:
  - title: SQLAlchemy model pattern
    snippet: |
      from sqlalchemy import Column, String, Float, DateTime
      from sqlalchemy.ext.declarative import declarative_base

      Base = declarative_base()

      class Wallet(Base):
          __tablename__ = 'wallets'
          address = Column(String, primary_key=True)
          coin_type = Column(String, nullable=False)
          balance = Column(Float)

design_decisions:
  - decision: Use SQLite over PostgreSQL for MVP
    rationale: Single-user deployment, no external dependencies, easier setup
  - decision: Alembic for migrations over raw SQL
    rationale: Version-controlled schema evolution, rollback support
  - decision: Composite primary key (tx_hash, coin_type) for transactions
    rationale: Same tx_hash can exist across different chains

risks:
  - severity: medium
    description: SQLite write concurrency limitations if dashboard adds background jobs
    mitigation: Document upgrade path to PostgreSQL, use WAL mode for better concurrency

references:
  - path: .pHive/epics/crypto-wallet-expansion-20260731/docs/research-brief.md
    relevant_excerpt: |
      **Data Model**:
      Wallet - address, coin_type, first_seen, last_active
      Transaction - tx_hash, from_address, to_address, amount, timestamp
      WalletLink - wallet_a, wallet_b, relationship_type, transaction_count

parallel_allowed: false
