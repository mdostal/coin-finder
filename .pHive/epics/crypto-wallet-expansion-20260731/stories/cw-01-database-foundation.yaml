    agent: developer
    depends_on: [research]
  - id: test
    description: Write tests for CRUD operations, index performance, and JSON migration
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review schema design, index choices, and migration safety
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit database layer to feature branch
    agent: developer
    depends_on: [review]

