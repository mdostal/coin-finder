description: |
  Implement SQLite database layer to replace JSON file storage. Create schema for
  wallets, transactions, and wallet_links tables with proper indexes. Add connection
  management and migration support for future schema evolution.

acceptance_criteria:
  - "Given a database connection, when schema is initialized, then tables wallets, transactions, and wallet_links exist with correct columns"
  - "Given a wallet address, when inserted, then it can be queried by address or coin_type"
  - "Given transaction data, when inserted, then it can be queried by tx_hash, address, or date range"
  - "Given wallet links, when inserted, then relationships can be queried bidirectionally"
  - "Given existing JSON outputs, when migration runs, then data is preserved in new schema"

