code_examples:
  - title: File metadata extraction
    snippet: |
      from pathlib import Path
      from datetime import datetime

      file_path = Path("/path/to/wallet.dat")
      stat = file_path.stat()
      created_at = datetime.fromtimestamp(stat.st_ctime).isoformat()
      modified_at = datetime.fromtimestamp(stat.st_mtime).isoformat()

  - title: Confidence scoring algorithm
    snippet: |
      def calculate_confidence(file_path, extension, keywords_matched, coins_matched):
          score = 0.0
          if extension in WALLET_EXTENSIONS:
              score += 0.4
          score += min(0.3, len(keywords_matched) * 0.1)
          score += min(0.3, len(coins_matched) * 0.15)
          return round(score, 2)

design_decisions:
  - decision: Use st_ctime (creation) and st_mtime (modification) timestamps
    rationale: Both useful - creation for "wallets from 2020" filter, modification for "recently updated" filter
  - decision: Confidence scoring weighted 40% extension, 30% keywords, 30% coin names
    rationale: Extension most reliable signal (binary match), keywords/coins can overlap
  - decision: Store metadata in Wallet.metadata_json as JSON string
    rationale: Flexible schema for future metadata additions without migration

risks:
  - severity: low
    description: st_ctime semantics vary by OS (Windows = creation, Unix = metadata change)
    mitigation: Document cross-platform behavior, prioritize st_mtime for accuracy
  - severity: low
    description: Confidence scoring may false-positive on unrelated files with crypto keywords
    mitigation: Manual review step in dashboard, export low-confidence files separately

references:
  - path: .pHive/epics/crypto-wallet-expansion-20260731/docs/design-discussion.md
    relevant_excerpt: |
