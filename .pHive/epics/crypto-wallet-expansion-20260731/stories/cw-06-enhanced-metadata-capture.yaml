description: |
  Extend search_wallets tool to capture file creation/modification timestamps using
  Path.stat(). Implement confidence scoring algorithm based on extension + keyword +
  coin name matches. Add date range filtering CLI flags. Store metadata in Wallet
  model metadata_json field.

acceptance_criteria:
  - "Given a wallet file, when scanned, then created_at and modified_at timestamps captured"
  - "Given extension match + keyword match, when scored, then confidence ≥ 0.7"
  - "Given --created-after flag, when search runs, then only files created after date returned"
  - "Given --created-before flag, when search runs, then only files created before date returned"
  - "Given --min-confidence 0.8 flag, when search runs, then low-confidence files excluded"

