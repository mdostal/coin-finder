code_examples:
  - title: FastAPI app with plugin route mounting
    snippet: |
      from fastapi import FastAPI
      from fastapi.middleware.cors import CORSMiddleware
      from plugins.registry import PluginRegistry

      app = FastAPI(title="Crypto Wallet Dashboard")

      app.add_middleware(
          CORSMiddleware,
          allow_origins=["http://localhost:3000"],
          allow_methods=["*"],
          allow_headers=["*"],
      )

      registry = PluginRegistry()
      registry.load_plugins()

      for plugin in registry.get_enabled_plugins():
          for router in plugin.get_routes():
              app.include_router(router)

design_decisions:
  - decision: Single FastAPI app over microservices
    rationale: Simpler deployment, lower latency, sufficient for single-user scale
  - decision: WebSocket for real-time updates over polling
    rationale: Lower latency, reduced server load, better UX for long-running scans
  - decision: Serve React static build from FastAPI over separate nginx
    rationale: Fewer moving parts, easier local development, single port deployment
  - decision: CORS allow localhost:3000 for development, configurable for production
    rationale: Security - restrict origins, but flexible for dev/prod environments

risks:
  - severity: low
    description: WebSocket connection drops require reconnection logic
    mitigation: Implement automatic reconnection with exponential backoff in frontend
  - severity: low
    description: Static file serving from FastAPI less efficient than nginx
    mitigation: Document nginx reverse proxy setup for production, acceptable for MVP

