                  return None

design_decisions:
  - decision: Store all transactions in DB on first fetch, then incremental updates
    rationale: Transactions are immutable once confirmed, avoid redundant API calls
  - decision: Use /address/{addr}/txs endpoint over /address/{addr} for full TX list
    rationale: Detailed TX data needed for graph traversal, not just summary stats
  - decision: Exponential backoff with max 5 retries on rate limit (429)
    rationale: Blockstream public API has unstated rate limits, aggressive backoff prevents bans

risks:
  - severity: medium
    description: Blockstream API lacks official rate limit documentation
    mitigation: Conservative request pacing (1 req/sec), exponential backoff, fallback to Bitcoin Core RPC in docs
  - severity: low
    description: Large wallets (1000+ TXs) may timeout on first fetch
    mitigation: Pagination with last_seen_txid parameter, background job for initial sync

