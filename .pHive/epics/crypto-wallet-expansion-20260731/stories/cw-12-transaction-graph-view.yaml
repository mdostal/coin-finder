code_examples:
  - title: ReactFlow basic setup
    snippet: |
      import ReactFlow, { Node, Edge } from 'reactflow';
      import 'reactflow/dist/style.css';

      function TransactionGraph({ seedAddress }: { seedAddress: string }) {
        const [nodes, setNodes] = useState<Node[]>([]);
        const [edges, setEdges] = useState<Edge[]>([]);

        useEffect(() => {
          fetch(`/api/wallet_finder/graph/${seedAddress}`)
            .then(r => r.json())
            .then(data => {
              setNodes(data.nodes);
              setEdges(data.edges);
            });
        }, [seedAddress]);

        return <ReactFlow nodes={nodes} edges={edges} />;
      }

design_decisions:
  - decision: ReactFlow over D3.js
    rationale: Built for React, handles pan/zoom out of box, easier node interaction
  - decision: Dagre layout over force-directed for initial positioning
    rationale: More predictable hierarchical layout, better for transaction flows
  - decision: Server-side graph computation, client renders result
    rationale: Heavy computation (BFS, layout) offloaded to backend, faster client load
  - decision: Lazy expansion on node click over loading full graph upfront
    rationale: Avoids overwhelming UI, progressive disclosure of complexity

risks:
  - severity: high
    description: Graphs with 1000+ nodes cause browser freezes
    mitigation: Server-side clustering (aggregate low-value nodes), canvas rendering, WebGL acceleration
  - severity: medium
    description: Layout algorithm slow on complex graphs
    mitigation: Compute layout server-side, send positioned nodes to client

