design_decisions:
  - decision: Host-binding guard lives in create_app() itself, enforced by a test, not documented-only convention.
    rationale: docs/design-discussion.md flags this as a real risk (directory-browse is path-traversal-shaped by design; fine locally, not fine if ever exposed) that must survive future refactors, not just today's code.
  - decision: In-memory job registry, no task-queue dependency.
    rationale: Single local user, one scan at a time is the realistic pattern; matches every existing tool's already-synchronous, blocking-call design.

risks:
  - severity: medium
    description: A results page rendering the relationship-graph Markdown as raw HTML could introduce an XSS-shaped issue if any address/file-path string is ever attacker-influenced.
    mitigation: Render via Jinja2 autoescaping (Flask's default) for all interpolated values; only the pre-rendered graph Markdown itself goes through a markdown-to-HTML pass, and that input is derived from local scan data the same user already has filesystem access to -- not third-party input.
  - severity: low
    description: Long scans (large drives) block the single background thread's target function on network I/O already known to be occasionally rate-limited.
    mitigation: Already handled by the underlying tools' retry/inconclusive-tracking; the UI surfaces "inconclusive, recheck later" rather than hiding it.

references:
  - path: .pHive/epics/local-web-ui/docs/research-brief.md
    relevant_excerpt: "All 13 tools are already pure-function-callable... No tool requires re-implementation to be UI-drivable."
  - path: .pHive/epics/local-web-ui/docs/design-discussion.md
    relevant_excerpt: "hard-fail startup (refuse to bind) if --host is passed anything other than 127.0.0.1/localhost"
