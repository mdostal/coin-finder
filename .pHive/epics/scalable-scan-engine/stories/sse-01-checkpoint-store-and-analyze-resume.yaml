      WAL mode + busy_timeout configured) and for analyze_wallets.py's new
      checkpoint_path parameter (resume, multiprocessing correctness,
      worker-exception handling, scan_index.py single-writer guarantee).
      Do NOT read implementation code -- tests define expected behavior
      from the acceptance criteria and design-discussion.md/structured-outline.md.
    agent: tester
    depends_on: [research]
  - id: implement
    description: |
      Implement tools/checkpoint_store.py. Refactor search_wallets.py to
      use it (behavior-preserving). Add checkpoint_path + processes
      parameters to analyze_wallets.py with multiprocessing.Pool, module-
      level picklable worker function, main-process-only scan_index.py
      writes. Thread checkpoint_path into run_pipeline.py's find() call to
      analyze_wallets (currently only passed to search_for_wallets).
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Review for correctness, convention compliance, and specifically verify no scan_index.py concurrent-writer regression and no memory-growth regression versus the fixed pattern.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

