id: sse-01-checkpoint-store-and-analyze-resume
epic: scalable-scan-engine
title: Shared checkpoint store + analyze resume/parallelism
status: pending
complexity: high
methodology: tdd
depends_on: []

description: |
  Extract a generic, reusable sqlite-backed checkpoint store from
  tools/search_wallets.py's already-shipped design (v0.53.6, tonight), then
  wire tools/analyze_wallets.py onto it with real per-file resume AND real
  multiprocessing.Pool parallelism. This is the foundation every other
  story in this epic builds on, and it closes the single biggest live
  correctness gap in the pipeline today: analyze has ZERO resume support,
  so a crash mid-analyze on a huge file list restarts that entire stage
  from zero.

  Analyze is CPU-bound (regex matching over file content) -- Python
  threads provide no real parallelism here (GIL). multiprocessing.Pool is
  the first genuine multi-core use in this pipeline, directly serving the
  user's confirmed requirement: "if I get more cores, a faster machine, I
  should have toggles... to let it use more resources."

  Critical constraint: tools/scan_index.py (the existing content-hash dedup
  cache analyze already uses) must NOT get concurrent writers from worker
  processes -- keep all scan_index.py writes in the main process, workers
  only return analysis results.

acceptance_criteria:
  - "Given a checkpoint_path, when search_wallets.py's tests run unchanged, then all existing behavior (resume, fresh-start, different-start-path reset, clean-completion deletion) still passes via the extracted CheckpointStore"
  - "Given analyze_wallets.py is interrupted mid-run (simulated: kill after N files), when it's re-invoked with the same checkpoint_path, then already-analyzed files are skipped and only remaining files are processed"
  - "Given a multi-file input, when analyze_wallets.py runs with analyze_processes > 1, then multiple files are analyzed concurrently via multiprocessing.Pool, and results are identical to the sequential result for the same input"
  - "Given a single worker's analysis raises an exception on one file, when the pool is running, then that failure is captured and surfaced without killing the whole pool (mirrors check_wallet_balances.py's existing future.result() re-raise pattern)"
  - "Given scan_index.py's dedup cache, when analyze runs with multiprocessing, then all record_scanned_file() writes happen only in the main process -- a test asserts zero concurrent writers reach scan_index.db"
  - "Given a CheckpointStore instance, when 100k+ units are marked completed, then memory use and per-flush write cost stay flat (a regression test bounds this, e.g. asserting flush() time doesn't grow with prior completed-unit count)"

