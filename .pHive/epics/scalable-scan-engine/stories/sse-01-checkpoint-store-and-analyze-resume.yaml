code_examples:
  - title: "Current sqlite checkpoint pattern to extract (tools/search_wallets.py)"
    file: tools/search_wallets.py
    snippet: |
      def _open_checkpoint_db(checkpoint_path, start_path):
          if not checkpoint_path:
              return None
          conn = sqlite3.connect(str(checkpoint_path))
          conn.execute("CREATE TABLE IF NOT EXISTS meta (key TEXT PRIMARY KEY, value TEXT)")
          conn.execute("CREATE TABLE IF NOT EXISTS completed_dirs (path TEXT PRIMARY KEY)")
          row = conn.execute("SELECT value FROM meta WHERE key = 'start_path'").fetchone()
          if row is None:
              conn.execute("INSERT INTO meta (key, value) VALUES ('start_path', ?)", (str(start_path),))
              conn.commit()
          elif row[0] != str(start_path):
              conn.execute("DELETE FROM completed_dirs")
              conn.execute("UPDATE meta SET value = ? WHERE key = 'start_path'", (str(start_path),))
              conn.commit()
          return conn
  - title: "Existing worker-exception re-raise pattern to mirror (tools/check_wallet_balances.py)"
    file: tools/check_wallet_balances.py
    snippet: |
      with ThreadPoolExecutor(max_workers=min(len(tasks), GLOBAL_MAX_WORKERS)) as executor:
          futures = [executor.submit(check_one, crypto_name, file_path, address) for ...]
          for future in as_completed(futures):
              future.result()  # re-raise any worker exception on the main thread

design_decisions:
  - decision: "CheckpointStore lives at tools/checkpoint_store.py, not web/"
    rationale: "Reusable by both standalone tool scripts (python3 tools/search_wallets.py CLI usage) and the web app, matching how every other tools/*.py module already works -- confirmed with user"
  - decision: "scan_index.py writes stay in the main process only during analyze's multiprocessing"
    rationale: "Avoids introducing concurrent multi-process writers to scan_index.db entirely, rather than adding new WAL/locking there too -- smaller, safer change"

risks:
  - severity: high
    description: "Rewriting the checkpoint I/O on a tool that had 2 real incidents tonight risks a new, different bug"
    mitigation: "New dedicated test file (test_checkpoint_store.py) with a real multi-thousand-unit test proving flat memory/flush-cost; search_wallets.py's existing test suite must pass unchanged as a regression guard"
  - severity: high
    description: "multiprocessing.Pool worker crash/exception handling, pickling edge cases (non-UTF8 paths, very large individual files)"
    mitigation: "Explicit per-worker-result exception capture, mirroring check_wallet_balances.py's existing future.result() pattern; a single bad file must not kill the whole pool"

cross_cutting:
