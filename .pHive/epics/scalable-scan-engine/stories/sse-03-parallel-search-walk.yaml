    change: "Replace sequential os.walk with a bounded thread-pool work-queue walk over CheckpointStore-tracked subtrees; add walk_threads parameter"
  - file: tests/test_search_wallets.py
    change: "Add parallel-walk test coverage alongside existing sequential tests"

design_decisions:
  - decision: "Default worker count conservative (2-4), independently tunable from rclone's own --checkers/--tpslimit"
    rationale: "Confirmed real interaction risk with tonight's rclone quota incident -- this is not a hypothetical, it already happened once with a different concurrency knob on the same mount"

risks:
  - severity: medium
    description: "Search-walk thread pool concurrency directly interacts with the rclone quota incident from tonight"
    mitigation: "Conservative default (2-4 threads), explicit load test against a real Google Drive mount required before this story is considered done -- not just passing unit tests"

