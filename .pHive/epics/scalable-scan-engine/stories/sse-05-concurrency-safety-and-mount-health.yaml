    relevant_excerpt: "Part 1.7 (concurrency-safety guard + mount health design)."
  - path: .pHive/epics/scalable-scan-engine/docs/design-discussion.md
    relevant_excerpt: "§4.4/§4.5 -- the original confirmed gaps this story closes."
