<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}coin-finder{% endblock %}</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 2rem auto; max-width: 960px; color: #222; }
  table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
  td, th { border: 1px solid #ccc; padding: 4px 8px; text-align: left; font-size: 0.9rem; }
  th { background: #f0f0f0; }
  .error { color: #b00020; }
  .warning { color: #8a5a00; background: #fff7e6; padding: 0.75rem; border: 1px solid #f0c36d; }
  pre { background: #f5f5f5; padding: 1rem; overflow-x: auto; white-space: pre-wrap; }
  a { color: #0a5; }
  input[type=text] { padding: 0.4rem; }
  button { padding: 0.4rem 0.8rem; }
</style>
</head>
<body>
<h1><a href="{{ url_for('index') }}">coin-finder</a></h1>
{% block content %}{% endblock %}
</body>
</html>
